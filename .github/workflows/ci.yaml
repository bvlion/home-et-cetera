name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-verify-cadence-xs: ${{ steps.filter.outputs.should-verify-cadence-xs }}

    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Detect service changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            should-verify-cadence-xs:
              - 'cadence-xs/**'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/cadence-xs-ci.yaml'

  cadence-xs:
    needs: changes
    if: needs.changes.outputs.should-verify-cadence-xs == 'true'
    uses: ./.github/workflows/cadence-xs-ci.yaml

  # main rulesetの必須チェック名testを、共通CIの集約結果として維持する。
  test:
    needs: [changes, cadence-xs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        env:
          CHANGE_DETECTION_RESULT: ${{ needs.changes.result }}
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if [[ "$CHANGE_DETECTION_RESULT" != success || "$JOB_RESULTS" == *'"failure"'* || "$JOB_RESULTS" == *'"cancelled"'* ]]; then
            echo '変更判定またはサービスの検証に失敗しました。' >&2
            exit 1
          fi

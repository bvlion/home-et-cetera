name: cloud-concierge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  cloud-concierge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-concierge/functions
    steps:
      - uses: actions/checkout@v7
      - name: Detect cloud-concierge changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            should-verify-cloud-concierge:
              - 'cloud-concierge/**'
              - '.github/workflows/cloud-concierge-ci.yaml'
              - '.github/workflows/cloud-concierge-deploy.yaml'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.should-verify-cloud-concierge == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud-concierge/functions/package-lock.json
      - uses: actions/setup-java@v5
        if: steps.filter.outputs.should-verify-cloud-concierge == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify cloud-concierge
        if: steps.filter.outputs.should-verify-cloud-concierge == 'true'
        run: |
          npm ci
          npm run lint
          npm run test:emulators

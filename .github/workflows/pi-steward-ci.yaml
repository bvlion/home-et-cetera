name: pi-steward CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  pi-steward-test:
    name: pi-steward-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-steward
    steps:
      - uses: actions/checkout@v7
      - name: Detect pi-steward changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            should-verify-pi-steward:
              - 'pi-steward/**'
              - '.github/workflows/pi-steward-ci.yaml'
      - uses: actions/setup-node@v6
        if: steps.filter.outputs.should-verify-pi-steward == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pi-steward/package-lock.json
      - name: Install ShellCheck
        if: steps.filter.outputs.should-verify-pi-steward == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
      - name: Verify pi-steward
        if: steps.filter.outputs.should-verify-pi-steward == 'true'
        run: |
          npm ci
          npm test
          node --check index.js
          node --check holiday_notification.js
          node --check logger.js
          node --check test/dependencies.test.js
          bash -n setup.sh
          bash -n shells/pc_switch.sh
          shellcheck setup.sh shells/pc_switch.sh

name: cadence-xs CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # 移行中は旧必須チェックを成功扱いで生成し、ruleset更新までマージ待ちを防ぐ。
  test:
    if: false
    runs-on: ubuntu-latest

  cadence-xs-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect cadence-xs changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            should-verify-cadence-xs:
              - 'cadence-xs/**'
              - '.github/workflows/cadence-xs-ci.yaml'

      # ローカルの検証用Compose(compose.check.yaml)と同じ安全な入口を使用する。
      # make check は検証専用のCompose project(cadence-xs-check)だけを使い、
      # 成功・失敗にかかわらず自分自身でそのprojectをcleanupする。
      - name: make check
        if: steps.filter.outputs.should-verify-cadence-xs == 'true'
        working-directory: cadence-xs
        run: make check
